name: Gaming Hub Android voice integration APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-test-apk.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'release/source_manifest.json'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'native/android/voice/**'
  push:
    branches: [feature/voice-media-from-validated-client, release/voice-complete-play-candidate]
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - 'data/**'
      - 'addons/**'
      - 'assets/**'
      - 'tests/**'
      - 'server/**'
      - 'release/source_manifest.json'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'native/android/voice/**'
      - '.github/workflows/android-test-apk.yml'
concurrency:
  group: gaminghub-voice-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-voice-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate source inventory and package identity
        run: |
          python3 release/verify_project_upload.py
          grep -q 'com.iroaa15.gaminghub' export_presets.cfg
          grep -q 'permissions/record_audio=true' export_presets.cfg
      - name: Install Python server dependencies
        run: python3 -m pip install -r server/requirements.txt
      - name: Test consent and voice packet relay
        run: python3 -m unittest discover -s server -p 'test_voice_signaling.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using runner tools
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is required}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Configure temporary debug signing and SDK
        shell: bash
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import and parse Godot project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee voice-android-import.log
      - name: Verify voice PCM codec
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/voice_pcm_smoke.gd 2>&1 | tee voice-pcm-smoke.log
          grep -q VOICE_PCM_SMOKE_PASS voice-pcm-smoke.log
      - name: Guard native voice plugin integration status
        shell: bash
        run: |
          # The standard export is not a native-voice build. Keep this explicit.
          test -f native/android/voice/GamingHubVoice.gdap
          if grep -q '^gradle_build/use_gradle_build=false' export_presets.cfg; then
            echo 'NOTICE: APK uses standard Godot export; native AAR is NOT embedded.'
            echo 'Native speakerphone AEC/AGC cannot be validated with this APK.'
          fi
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android Gradle export template
        shell: bash
        run: |
          set -euo pipefail
          # setup-godot does not always create this directory; absence is normal.
          template="$(find "$HOME/.local/share/godot/export_templates" -name android_source.zip -type f -print -quit 2>/dev/null || true)"
          echo "Cached Android Gradle template: ${template:-not present}"
          if [ -z "$template" ]; then
            echo 'Downloading official Godot 4.5.1 export templates for Android Gradle'
            curl -fL --retry 2 --connect-timeout 15 --max-time 150 -o /tmp/godot-android-templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
            unzip -p /tmp/godot-android-templates.tpz templates/android_source.zip > /tmp/android_source.zip
            template=/tmp/android_source.zip
            rm -f /tmp/godot-android-templates.tpz
          fi
          test -s "$template"
          mkdir -p android
          # android_source.zip stores build.gradle at its root. Godot expects it under android/build/.
          mkdir -p android/build
          timeout 90s unzip -q "$template" -d android/build
          test -s android/build/build.gradle
          test -s android/build/settings.gradle
          # Godot 4.5.1 checks android/.build_version against GODOT_VERSION_FULL_CONFIG.
          printf '4.5.1.stable\n' > android/.build_version
          touch android/build/.gdignore
          test "$(cat android/.build_version)" = '4.5.1.stable'
          echo 'Godot Android Gradle template installed with matching version marker'
      - name: Build and embed native speakerphone plugin
        shell: bash
        run: |
          set -euo pipefail
          printf 'android.useAndroidX=true\n' > native/android/voice/gradle.properties
          cd native/android/voice
          gradle assembleRelease --no-daemon
          mkdir -p ../../../android/plugins
          aar="$(find build/outputs/aar -maxdepth 1 -name '*.aar' -type f | head -n 1)"
          test -s "$aar"
          cp "$aar" ../../../android/plugins/GamingHubVoice.aar
          cp GamingHubVoice.gdap ../../../android/plugins/GamingHubVoice.gdap
          test -s ../../../android/plugins/GamingHubVoice.aar
      - name: Export native speakerphone Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          timeout 12m godot --headless --path . --export-debug 'Android Voice Native' build/GamingHub-voice-native.apk 2>&1 | tee voice-native-export.log
          test -s build/GamingHub-voice-native.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify build/GamingHub-voice-native.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions build/GamingHub-voice-native.apk | grep -q android.permission.RECORD_AUDIO
      - name: Upload native speakerphone APK
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-Voice-Native-Speakerphone-APK
          path: build/GamingHub-voice-native.apk
          if-no-files-found: error
          retention-days: 14
      - name: Export installable Android APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          timeout 12m godot --headless --path . --export-debug Android build/GamingHub-voice-experimental.apk 2>&1 | tee voice-android-export.log
          test -s build/GamingHub-voice-experimental.apk
      - name: Verify APK signature and permissions
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify build/GamingHub-voice-experimental.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions build/GamingHub-voice-experimental.apk | tee voice-android-permissions.log
          grep -q 'android.permission.RECORD_AUDIO' voice-android-permissions.log
          grep -q 'android.permission.INTERNET' voice-android-permissions.log
      - name: Upload experimental Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-Voice-Experimental-Android-APK
          path: build/GamingHub-voice-experimental.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-Voice-Android-Build-Logs
          path: |
            voice-*.log
          if-no-files-found: ignore
          retention-days: 14
