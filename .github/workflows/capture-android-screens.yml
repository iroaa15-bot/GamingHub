name: Capture Gaming Hub on Android emulator
on:
  push:
    branches: [codex/v11.7-store-screenshots]
    paths: ['.github/workflows/capture-android-screens.yml']
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download v11.7 debug APK built from the reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/android-screens build/apk
          gh run download 38846362162 --repo iroaa15-bot/GamingHub --name GamingHub-v11.5-Android-Debug --dir build/apk
          find build/apk -type f -name '*.apk' -print
          test -f build/apk/GamingHub-v11.5-debug.apk
      - name: Boot API 36 emulator and capture actual app screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb install build/apk/GamingHub-v11.5-debug.apk
            adb shell monkey -p com.iroaa15.gaminghub 1
            sleep 20
            adb exec-out screencap -p > build/android-screens/01-launch.png
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' > build/android-screens/window-focus.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GamingHub-v11.7-Android-emulator-screens
          path: build/android-screens/
          if-no-files-found: warn
          retention-days: 14
