name: Godot 4.5.1 Android Debug - Source, Runtime and Package Gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python3 -m pip install -r server/requirements.txt
      - name: Reject incomplete GitHub source upload
        run: python3 release/verify_project_upload.py
      - name: Verify exact source SHA-256 manifest
        run: python3 release/source_manifest.py
      - name: Verify deterministic upload archive
        run: |
          python3 release/source_archive.py --output /tmp/gaminghub-source.zip
          python3 release/source_archive.py --verify /tmp/gaminghub-source.zip
      - name: Run all checks against the exact upload archive
        run: python3 release/verify_archive_runtime.py /tmp/gaminghub-source.zip
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - name: Godot import and GDScript parsing
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee godot-import.log
      - name: Optional account client smoke
        run: |
          timeout 45 godot --headless --path . --script res://tests/auth_client_smoke.gd 2>&1 | tee auth-client.log
          grep -q AUTH_CLIENT_SMOKE_PASS auth-client.log
      - name: Main, multiplayer and offline game smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --script res://tests/godot_smoke.gd 2>&1 | tee godot-smoke.log
          grep -q 'GODOT_SMOKE_PASS' godot-smoke.log
      - name: Verify additive content and reward gates at runtime
        run: |
          timeout 120 godot --headless --path . --script res://tests/release_runtime.gd 2>&1 | tee release-runtime.log
          grep -q RELEASE_RUNTIME_PASS release-runtime.log
      - name: Boot main scene for 60 frames
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --quit-after 60 2>&1 | tee godot-boot.log
      - name: Keep diagnostic logs when validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: godot-*.log
          if-no-files-found: ignore
          retention-days: 14
  android-debug:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete source before export
        run: python3 release/verify_project_upload.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Create disposable debug-only signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA \
            -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import assets and check GDScript
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee godot-android-import.log
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-debug Android build/GamingHub-v11.5-debug.apk 2>&1 | tee godot-android-export.log
      - name: Build unsigned release bundle without private credentials
        run: python3 release/build_unsigned_bundle.py
      - name: Keep unsigned bundle for local upload-key signing
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-v11.7-unsigned-bundle
          path: build/GamingHub-v11.7-unsigned.aab
          retention-days: 14
      - name: Validate package, signature, identity and network permission
        shell: bash
        run: |
          set -euo pipefail
          python3 release/verify_android_package.py build/GamingHub-v11.5-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/GamingHub-v11.5-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/GamingHub-v11.5-debug.apk | tee android-package-info.log
          grep -q "package: name='com.iroaa15.gaminghub'" android-package-info.log
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions build/GamingHub-v11.5-debug.apk | tee android-permissions.log
          grep -q 'android.permission.INTERNET' android-permissions.log
          grep -Eq "targetSdkVersion:'36'|targetSdkVersion='36'" android-package-info.log
      - name: Keep diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-build-logs
          path: |
            godot-*.log
            android-*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish installable debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-v11.5-Android-Debug
          path: build/GamingHub-v11.5-debug.apk
          if-no-files-found: error
          retention-days: 14

  identity-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gaminghub_identity_ci
          POSTGRES_USER: gaminghub
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaminghub -d gaminghub_identity_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'pytest>=8,<10' 'psycopg[binary]>=3.2,<4'
      - name: Exercise account lifecycle against PostgreSQL
        env:
          GAMINGHUB_DATABASE_URL: postgresql://gaminghub:test-only-password@localhost:5432/gaminghub_identity_ci
        run: python -m pytest -q identity_backend/test_integration.py identity_backend/test_match_awards.py identity_backend/test_session_bindings.py
  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gaminghub_test
          POSTGRES_USER: gaminghub
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaminghub -d gaminghub_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Verify real PostgreSQL writes survive reconnection
        env:
          DATABASE_URL: postgresql://gaminghub:test-only-password@localhost:5432/gaminghub_test
        run: |
          python - <<'PY'
          import os, uuid, psycopg
          url = os.environ["DATABASE_URL"]
          uid = str(uuid.uuid4())
          with psycopg.connect(url) as db:
              db.execute("CREATE TABLE ci_persistence (id TEXT PRIMARY KEY, score INTEGER NOT NULL)")
              db.execute("INSERT INTO ci_persistence VALUES (%s,%s)", (uid,42))
              db.commit()
          with psycopg.connect(url) as db:
              assert db.execute("SELECT score FROM ci_persistence WHERE id=%s",(uid,)).fetchone() == (42,)
              db.execute("UPDATE ci_persistence SET score=50 WHERE id=%s",(uid,))
              db.commit()
          with psycopg.connect(url) as db:
              assert db.execute("SELECT score FROM ci_persistence WHERE id=%s",(uid,)).fetchone() == (50,)
          print("POSTGRES_SMOKE_PASS")
          PY
