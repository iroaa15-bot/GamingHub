name: Godot 4.5.1 Android Debug - Source, Runtime and Package Gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python3 -m pip install -r server/requirements.txt
      - name: Reject incomplete GitHub source upload
        run: python3 release/verify_project_upload.py
      - name: Verify exact source SHA-256 manifest
        run: python3 release/source_manifest.py
      - name: Verify deterministic upload archive
        run: |
          python3 release/source_archive.py --output /tmp/gaminghub-source.zip
          python3 release/source_archive.py --verify /tmp/gaminghub-source.zip
      - name: Run all checks against the exact upload archive
        run: python3 release/verify_archive_runtime.py /tmp/gaminghub-source.zip
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - name: Godot import and GDScript parsing
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee godot-import.log
      - name: Main, multiplayer and offline game smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --script res://tests/godot_smoke.gd 2>&1 | tee godot-smoke.log
          grep -q 'GODOT_SMOKE_PASS' godot-smoke.log
      - name: Verify additive content and reward gates at runtime
        run: |
          timeout 120 godot --headless --path . --script res://tests/release_runtime.gd 2>&1 | tee release-runtime.log
          grep -q RELEASE_RUNTIME_PASS release-runtime.log
      - name: Verify account session restoration and origin isolation
        # Storage double here; Android Keystore acceptance is recorded separately.
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --script res://tests/session_persistence.gd 2>&1 | tee godot-session.log
          grep -q 'PASS: refresh restoration' godot-session.log
          timeout 120 godot --headless --audio-driver Dummy --path . --script res://tests/public_account_requests.gd 2>&1 | tee godot-public-account.log
          grep -q PUBLIC_ACCOUNT_REQUESTS_PASS godot-public-account.log
            timeout 60 godot --headless --audio-driver Dummy --path . --script res://tests/avatar_picker_dispatch.gd 2>&1 | tee godot-avatar-picker.log
            grep -q AVATAR_PICKER_DISPATCH_PASS godot-avatar-picker.log
            timeout 60 godot --headless --audio-driver Dummy --path . --script res://tests/account_progress_isolation.gd 2>&1 | tee godot-account-isolation.log
            grep -q ACCOUNT_PROGRESS_ISOLATION_PASS godot-account-isolation.log
      - name: Verify unified profile and server point display
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --script res://tests/unified_profile.gd 2>&1 | tee godot-profile.log
          grep -q 'PASS: verified profile survives' godot-profile.log
      - name: Verify published presentation and offline fallback
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --script res://tests/remote_appearance.gd 2>&1 | tee godot-appearance.log
          grep -q REMOTE_APPEARANCE_PASS godot-appearance.log
      - name: Verify player account UI has no developer or admin controls
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --script res://tests/player_safe_account.gd 2>&1 | tee godot-safe-account.log
          grep -q PLAYER_SAFE_ACCOUNT_PASS godot-safe-account.log
      - name: Verify simplified navigation and role controls
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --script res://tests/unified_catalog_ui.gd 2>&1 | tee godot-catalog.log
          grep -q 'UNIFIED_CATALOG_UI true' godot-catalog.log
          timeout 120 godot --headless --path . --script res://tests/simplified_navigation.gd 2>&1 | tee godot-navigation.log
          grep -q SIMPLIFIED_NAVIGATION_PASS godot-navigation.log
          timeout 120 godot --headless --audio-driver Dummy --path . --script res://tests/button_inventory.gd 2>&1 | tee godot-button-inventory.log
          grep -q 'enabled_unwired=0' godot-button-inventory.log
            timeout 60 godot --headless --audio-driver Dummy --path . --script res://tests/voice_continuity.gd 2>&1 | tee godot-voice-continuity.log
            grep -q 'VOICE_CONTINUITY continuous=true text_stopped=true bounded=true' godot-voice-continuity.log
            timeout 60 godot --headless --audio-driver Dummy --path . --script res://tests/guess_and_membership.gd 2>&1 | tee godot-guess-membership.log
            grep -q GUESS_AND_MEMBERSHIP_PASS godot-guess-membership.log
      - name: Verify challenge audio controls and Android touch ordering
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --audio-driver Dummy --path . --script res://tests/challenge_audio.gd 2>&1 | tee godot-challenge-audio.log
          grep -q CHALLENGE_AUDIO_PASS godot-challenge-audio.log
          timeout 120 godot --headless --audio-driver Dummy --path . --script res://tests/room_audio_policy.gd 2>&1 | tee godot-audio-policy.log
          ! grep -q 'AUDIO_POLICY.*false' godot-audio-policy.log
      - name: Verify real WebSocket recovery and delayed resume acknowledgement
        shell: bash
        run: |
          set -o pipefail
          python3 -u tests/room_recovery_fixture.py > room-recovery-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if grep -q ROOM_RECOVERY_FIXTURE_READY room-recovery-fixture.log; then break; fi
            sleep 0.2
          done
          grep -q ROOM_RECOVERY_FIXTURE_READY room-recovery-fixture.log
          timeout 90 godot --headless --path . --script res://tests/automatic_room_resume.gd 2>&1 | tee godot-room-recovery.log
          grep -q AUTOMATIC_ROOM_RESUME_PASS godot-room-recovery.log
      - name: Boot main scene for 60 frames
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --quit-after 60 2>&1 | tee godot-boot.log
      - name: Keep diagnostic logs when validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: godot-*.log
          if-no-files-found: ignore
          retention-days: 14
  android-debug:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete source before export
        run: python3 release/verify_project_upload.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Create disposable debug-only signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA \
            -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import assets and check GDScript
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee godot-android-import.log
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-debug Android build/GamingHub-v11.5-debug.apk 2>&1 | tee godot-android-export.log
      - name: Build unsigned release bundle without private credentials
        run: python3 release/build_unsigned_bundle.py
      - name: Keep unsigned bundle for local upload-key signing
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-v11.7-unsigned-bundle
          path: build/GamingHub-v11.7-unsigned.aab
          retention-days: 14
      - name: Validate package, signature, identity and network permission
        shell: bash
        run: |
          set -euo pipefail
          python3 release/verify_android_package.py build/GamingHub-v11.5-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/GamingHub-v11.5-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/GamingHub-v11.5-debug.apk | tee android-package-info.log
          grep -q "package: name='com.iroaa15.gaminghub'" android-package-info.log
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions build/GamingHub-v11.5-debug.apk | tee android-permissions.log
          grep -q 'android.permission.INTERNET' android-permissions.log
          grep -Eq "targetSdkVersion:'36'|targetSdkVersion='36'" android-package-info.log
      - name: Keep diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-build-logs
          path: |
            godot-*.log
            android-*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish installable debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-v11.5-Android-Debug
          path: build/GamingHub-v11.5-debug.apk
          if-no-files-found: error
          retention-days: 14
