name: Gaming Hub Identity PostgreSQL Smoke
on:
  push:
    branches: [test/identity-postgres-ci-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gaminghub_test
          POSTGRES_USER: gaminghub
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gaminghub -d gaminghub_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://gaminghub:test-only-password@localhost:5432/gaminghub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Test PostgreSQL persistence across separate connections
        run: |
          python - <<'PY'
          import os, uuid, psycopg
          url = os.environ["DATABASE_URL"]
          uid = str(uuid.uuid4())
          with psycopg.connect(url) as db:
              db.execute("CREATE TABLE IF NOT EXISTS ci_persistence (id TEXT PRIMARY KEY, score INTEGER NOT NULL)")
              db.execute("INSERT INTO ci_persistence (id,score) VALUES (%s,%s)", (uid, 42))
              db.commit()
          with psycopg.connect(url) as db:
              row = db.execute("SELECT score FROM ci_persistence WHERE id=%s", (uid,)).fetchone()
              assert row == (42,), f"Unexpected row: {row}"
              db.execute("UPDATE ci_persistence SET score=score+8 WHERE id=%s", (uid,))
              db.commit()
          with psycopg.connect(url) as db:
              assert db.execute("SELECT score FROM ci_persistence WHERE id=%s", (uid,)).fetchone() == (50,)
          print("PASS: PostgreSQL commits persist across three connections")
          PY
