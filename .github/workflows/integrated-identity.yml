name: Integrated accounts and game rooms
on:
  pull_request:
    paths: ['identity_backend/**', 'server/**', 'tests/account_rooms_integration.py', '.github/workflows/integrated-identity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gaminghub_identity_ci
          POSTGRES_USER: gaminghub
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gaminghub -d gaminghub_identity_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GAMINGHUB_DATABASE_URL: postgresql://gaminghub:test-only-password@localhost:5432/gaminghub_identity_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r identity_backend/requirements.txt httpx pytest
      - run: python -m pytest -q identity_backend/test_integration.py identity_backend/test_provider_separation.py identity_backend/test_match_awards.py identity_backend/test_session_bindings.py identity_backend/test_composed_gameplay.py identity_backend/test_admin_owner.py identity_backend/test_player_avatar.py tests/account_rooms_integration.py
