name: Gaming Hub native Android voice compile
on:
  workflow_dispatch:
  push:
    branches: [feature/voice-media-from-validated-client]
    paths:
      - 'native/android/voice/**'
      - '.github/workflows/native-android-voice.yml'
permissions:
  contents: read
jobs:
  compile-native-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is required on the runner}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download Godot 4.5.1 Android plugin API library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/godot-api
          curl -fL --retry 3 --connect-timeout 20 \
            -o build/godot-api/godot-lib.release.aar \
            'https://repo.godotengine.org/artifactory/godot-maven/org/godotengine/godot/4.5.1.stable/godot-4.5.1.stable.aar'
          test -s build/godot-api/godot-lib.release.aar
      - name: Build full native Android Godot plugin AAR
        shell: bash
        run: |
          set -euo pipefail
          cd native/android/voice
          gradle assembleRelease -PgodotAar="$GITHUB_WORKSPACE/build/godot-api/godot-lib.release.aar" --no-daemon
          test -s build/outputs/aar/voice-release.aar
      - name: Upload experimental plugin AAR
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-Native-Voice-Plugin-AAR
          path: native/android/voice/build/outputs/aar/*.aar
          if-no-files-found: error
      - name: Compile Android voice engine against Android API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-voice-classes
          javac -Xlint:deprecation -source 8 -target 8 \
            -classpath "$ANDROID_HOME/platforms/android-36/android.jar" \
            -d build/native-voice-classes \
            native/android/voice/src/main/java/com/iroaa15/gaminghub/voice/SpeakerphoneAudioEngine.java
          test -s build/native-voice-classes/com/iroaa15/gaminghub/voice/SpeakerphoneAudioEngine.class
      - name: Verify Godot bridge methods and audio frame contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class GamingHubVoicePlugin extends GodotPlugin' native/android/voice/src/main/java/com/iroaa15/gaminghub/voice/GamingHubVoicePlugin.java
          grep -q 'public String pollPcm()' native/android/voice/src/main/java/com/iroaa15/gaminghub/voice/GamingHubVoicePlugin.java
          grep -q 'public boolean pushPcm(String encoded)' native/android/voice/src/main/java/com/iroaa15/gaminghub/voice/GamingHubVoicePlugin.java
          grep -q 'public static final int PACKET_SAMPLES = 320' native/android/voice/src/main/java/com/iroaa15/gaminghub/voice/SpeakerphoneAudioEngine.java
          test -s native/android/voice/src/main/AndroidManifest.xml
          grep -q 'org.godotengine.plugin.v2.GamingHubVoice' native/android/voice/src/main/AndroidManifest.xml
