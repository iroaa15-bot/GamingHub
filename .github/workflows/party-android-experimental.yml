name: Party Home Experimental Android
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - '.github/workflows/party-android-experimental.yml'
permissions:
  contents: read
jobs:
  experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: Install Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
      - name: Install Android export templates and Gradle build template
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot-export-templates.tpz https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p /tmp/godot-export-tpl "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q /tmp/godot-export-templates.tpz -d /tmp/godot-export-tpl
          cp -a /tmp/godot-export-tpl/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_source.zip"
          mkdir -p android/build
          unzip -qo "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_source.zip" -d android/build
          echo "Android template contents:"
          find android -maxdepth 4 \( -name build.gradle -o -name settings.gradle \) | head -30
          test -f android/build/build.gradle && test -f android/build/settings.gradle
      - name: Import and validate
        run: godot --headless --path . --editor --import --quit
      - name: Attempt Android debug export
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/GamingHub-PartyRoom-experimental.apk
          test -s build/GamingHub-PartyRoom-experimental.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GamingHub-PartyRoom-experimental
          path: build/GamingHub-PartyRoom-experimental.apk
          if-no-files-found: error
