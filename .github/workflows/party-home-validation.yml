name: Party Room safe home validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/main.gd'
      - 'scripts/home_layout_catalog.gd'
      - 'tests/test_home_layout_contract.py'
      - '.github/workflows/party-home-validation.yml'
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check legacy home, routing and service configuration
        run: python3 -m unittest discover -s tests -p 'test_home_layout_contract.py' -v
  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.5.1-stable_linux.x86_64
      - name: Import project and parse scripts
        run: |
          /tmp/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Launch main scene smoke
        run: |
          timeout 35s /tmp/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --quit-after 120
