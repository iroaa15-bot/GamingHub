name: Restore Original Gaming Hub Main APK
on:
  push:
    branches: [restore-original-main-apk-20261020]
    paths: [.github/workflows/restore-original-main-apk.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-original:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Verify production sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main" || test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          grep -q 'package/unique_name="com.iroaa15.gaminghub"' export_presets.cfg
          grep -q 'run/main_scene="res://scenes/Main.tscn"' project.godot
          test ! -f data/voice_staging.json
          echo "ORIGINAL_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Configure Android debug SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Missing Android SDK}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --path . --editor --import --quit
      - name: Export original game APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-main"
          timeout 900s godot --headless --path . --install-android-build-template --export-debug "Android" "$RUNNER_TEMP/original-main/GamingHub-Original-Main-11.7.apk"
          test -s "$RUNNER_TEMP/original-main/GamingHub-Original-Main-11.7.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/original-main/GamingHub-Original-Main-11.7.apk" | tee "$RUNNER_TEMP/original-main/apk-package.txt"
          grep -q "package: name='com.iroaa15.gaminghub'" "$RUNNER_TEMP/original-main/apk-package.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/original-main/GamingHub-Original-Main-11.7.apk"
          sha256sum "$RUNNER_TEMP/original-main/GamingHub-Original-Main-11.7.apk"
      - name: Upload original main APK
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-Original-Main-11.7-APK
          path: ${{ runner.temp }}/original-main/GamingHub-Original-Main-11.7.apk
          if-no-files-found: error
          retention-days: 14
