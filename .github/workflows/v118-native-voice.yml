name: Gaming Hub v11.8 Native Voice Compile
on:
  pull_request:
    paths:
      - 'android/voice-plugin/**'
      - '.github/workflows/v118-native-voice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl --fail --location --retry 3 --silent --show-error \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o /tmp/android-cmdline-tools.zip
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile native WebRTC plugin Kotlin
        working-directory: android/voice-plugin
        run: gradle --no-daemon --stacktrace compileDebugKotlin
      - name: Build Android library AAR
        working-directory: android/voice-plugin
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify native voice AAR structure
        shell: bash
        run: |
          set -euo pipefail
          python3 android/voice-plugin/verify_aar.py "$(find android/voice-plugin/build/outputs/aar -maxdepth 1 -name '*debug.aar' -print -quit)"
      - name: Stage WebRTC runtime dependencies
        working-directory: android/voice-plugin
        run: gradle --no-daemon --stacktrace stageVoiceRuntime
      - name: Validate staged native WebRTC libraries
        run: python3 android/voice-plugin/verify_runtime_stage.py android/voice-plugin/build/voice-runtime-staging
      - name: Install Godot 4.5.1 for isolated addon check
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - name: Verify experimental Godot voice export addon loads
        shell: bash
        run: |
          set -euo pipefail
          cp project.godot /tmp/gaminghub-project-original.godot
          trap 'cp /tmp/gaminghub-project-original.godot project.godot' EXIT
          cp android/voice-plugin/build/voice-runtime-staging/voice-plugin-debug.aar addons/gaminghub_voice/voice-plugin-debug.aar
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          data = p.read_text()
          old = 'enabled=PackedStringArray("res://addons/admob/plugin.cfg")'
          assert old in data, "unexpected editor plugin configuration"
          p.write_text(data.replace(old, 'enabled=PackedStringArray("res://addons/admob/plugin.cfg", "res://addons/gaminghub_voice/plugin.cfg")'))
          PY
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/gaminghub-voice-addon-import.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Invalid call|Cannot load script' /tmp/gaminghub-voice-addon-import.log; then
            echo "Experimental voice export addon failed Godot editor import"
            exit 1
          fi
          echo "GODOT_VOICE_ADDON_IMPORT_PASS"
      - name: Prepare isolated voice test Android APK
        shell: bash
        run: |
          set -euo pipefail
          python3 android/voice-plugin/prepare_debug_export.py
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA \
            -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Install Android export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" \
            -o /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
      - name: Export isolated v11.8 voice test APK
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --install-android-build-template --export-debug Android build/GamingHub-v11.8-voice-test.apk 2>&1 | tee /tmp/gaminghub-voice-apk-export.log
          test -s build/GamingHub-v11.8-voice-test.apk
      - name: Upload isolated voice test APK
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-v11.8-voice-test-APK-EXPERIMENTAL
          path: build/GamingHub-v11.8-voice-test.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload voice runtime staging
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-v11.8-voice-runtime-staging
          path: android/voice-plugin/build/voice-runtime-staging/
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-v11.8-native-voice-aar
          path: android/voice-plugin/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 7
