name: Gaming Hub v11.8 Native Voice Compile
on:
  pull_request:
    paths:
      - 'android/voice-plugin/**'
      - '.github/workflows/v118-native-voice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl --fail --location --retry 3 --silent --show-error \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o /tmp/android-cmdline-tools.zip
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile native WebRTC plugin Kotlin
        working-directory: android/voice-plugin
        run: gradle --no-daemon --stacktrace compileDebugKotlin
      - name: Build Android library AAR
        working-directory: android/voice-plugin
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify native voice AAR structure
        shell: bash
        run: |
          set -euo pipefail
          python3 android/voice-plugin/verify_aar.py "$(find android/voice-plugin/build/outputs/aar -maxdepth 1 -name '*debug.aar' -print -quit)"
      - name: Stage WebRTC runtime dependencies
        working-directory: android/voice-plugin
        run: gradle --no-daemon --stacktrace stageVoiceRuntime
      - name: Upload voice runtime staging
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-v11.8-voice-runtime-staging
          path: android/voice-plugin/build/voice-runtime-staging/
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-v11.8-native-voice-aar
          path: android/voice-plugin/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 7
