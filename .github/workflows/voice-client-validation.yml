name: Voice client integration validation
on:
  push:
    branches:
      - feature/voice-media-from-validated-client
    paths:
      - scripts/multiplayer.gd
      - scripts/voice_signaling_bridge.gd
      - scripts/voice_microphone_capture.gd
      - scripts/voice_pcm_transport.gd
      - server/server.py
      - server/test_voice_signaling.py
      - tests/voice_microphone_smoke.gd
      - export_presets.cfg
      - project.godot
      - tests/voice_client_smoke.gd
      - release/source_manifest.json
      - .github/workflows/voice-client-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-voice-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - name: Verify protected source manifest
        run: python3 release/source_manifest.py
      - name: Install server test dependencies
        run: python3 -m pip install -r server/requirements.txt
      - name: Test server consent and audio relay
        run: python3 -m unittest discover -s server -p 'test_voice_signaling.py' -v
      - name: Import Godot resources
        run: godot --headless --path . --editor --import --quit
      - name: Run consent and signaling bridge smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/voice_client_smoke.gd 2>&1 | tee voice-client-smoke.log
          grep -q 'VOICE_CLIENT_SMOKE_PASS' voice-client-smoke.log
      - name: Run microphone safety smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/voice_microphone_smoke.gd 2>&1 | tee voice-microphone-smoke.log
          grep -q 'VOICE_MICROPHONE_SMOKE_PASS' voice-microphone-smoke.log
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voice-client-smoke-log
          path: |
            voice-client-smoke.log
            voice-microphone-smoke.log
          if-no-files-found: ignore
