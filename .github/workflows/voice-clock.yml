name: PCM mixer deadline regression
on:
  pull_request:
    paths:
      - 'server/voice_frame_clock.py'
      - 'server/test_voice_frame_clock.py'
      - 'server/secure_duel_service.py'
      - '.github/workflows/voice-clock.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cadence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s server -p test_voice_frame_clock.py -v
      - run: python -m unittest discover -s tests -p secure_agreement_security.py -v
