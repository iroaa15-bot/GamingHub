name: Gaming Hub Android Voice Diagnostic APK
on:
  push:
    branches: [fix/android-voice-root-cause]
    paths: [.github/workflows/voice-diagnostic-apk.yml]
permissions:
  contents: read
concurrency:
  group: gaminghub-voice-diagnostic-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-voice-root-cause
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Validate isolated staging setup
        run: python3 -m unittest discover -s tests -p test_prepare_voice_staging.py -v
      - name: Validate voice AAR binaries
        run: python3 tools/verify_voice_aar.py
      - name: Prepare independent staging project
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_voice_staging.py --output "$RUNNER_TEMP/voice-project"
          grep -q 'com.iroaa15.gaminghub.voicestaging' "$RUNNER_TEMP/voice-project/export_presets.cfg"
          grep -q 'gaminghub-voice-staging.onrender.com' "$RUNNER_TEMP/voice-project/data/voice_staging.json"
      - name: Android SDK and signing setup
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK missing}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Import Godot resources
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/voice-project"
          timeout 180s godot --headless --path "$PROJECT" --editor --import --quit
          # Test navigation of the actual friend/offline entry screens before spending Gradle build time.
          timeout 90s godot --headless --path "$PROJECT" --script res://tests/godot_smoke.gd 2>&1 | tee "$RUNNER_TEMP/godot-navigation.log"
          grep -q 'GODOT_SMOKE_PASS' "$RUNNER_TEMP/godot-navigation.log"
      - name: Install Android Gradle template and export diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/voice-project"
          mkdir -p "$RUNNER_TEMP/apk"
          # Godot 4.5 requires template installation AND export in the same command.
          timeout 900s godot --headless --path "$PROJECT" --install-android-build-template --export-debug "Android" "$RUNNER_TEMP/apk/GamingHub-Voice-Diagnostics-11.7.apk"
          test -f "$PROJECT/android/build/build.gradle"
          test -s "$RUNNER_TEMP/apk/GamingHub-Voice-Diagnostics-11.7.apk"
          sha256sum "$RUNNER_TEMP/apk/GamingHub-Voice-Diagnostics-11.7.apk"
          # Validate the signed APK, packaged staging profile, DEX plugin and source fingerprint.
          python3 tools/verify_staging_apk.py "$RUNNER_TEMP/apk/GamingHub-Voice-Diagnostics-11.7.apk" --sdk "$ANDROID_HOME" --output "$RUNNER_TEMP/voice-validation"
          echo "VOICE_DIAGNOSTIC_APK_READY"
      - name: Upload Godot navigation diagnostics when build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-Godot-Navigation-Diagnostics
          path: ${{ runner.temp }}/godot-navigation.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: GamingHub-Voice-Diagnostics-11.7-APK
          path: ${{ runner.temp }}/apk/GamingHub-Voice-Diagnostics-11.7.apk
          if-no-files-found: error
          retention-days: 7
