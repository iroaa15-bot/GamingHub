name: Voice Staging Smoke (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-staging-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-voice-root-cause
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Check staging export isolation
        run: python -m unittest discover -s tests -p test_prepare_voice_staging.py -v
      - name: Install WebSocket test dependency
        run: python -m pip install 'websockets>=12,<16'
      - name: Verify live staging server only
        env:
          GAMINGHUB_STAGING_WS: wss://gaminghub-voice-staging.onrender.com
        run: python tests/smoke_voice_staging.py
