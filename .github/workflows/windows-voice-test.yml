name: Gaming Hub Windows desktop voice export
on:
  workflow_dispatch:
  push:
    branches: [feature/voice-media-from-validated-client]
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - 'data/**'
      - 'assets/**'
      - 'addons/**'
      - 'tests/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'release/source_manifest.json'
      - '.github/workflows/windows-voice-test.yml'
permissions:
  contents: read
jobs:
  windows-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Verify protected source on Linux
        run: python3 release/source_manifest.py
      - name: Import Godot resources
        run: godot --headless --path . --editor --import --quit
      - name: Run voice client smoke tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/voice_client_smoke.gd
          godot --headless --path . --script res://tests/voice_microphone_smoke.gd
          godot --headless --path . --script res://tests/voice_pcm_smoke.gd
      - name: Cross-export Windows x86_64 game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Windows Desktop" build/GamingHub-Windows-Voice.exe
          test -s build/GamingHub-Windows-Voice.exe
          test -s build/GamingHub-Windows-Voice.pck
      - name: Upload Windows game and PCK
        uses: actions/upload-artifact@v4
        with:
          name: GamingHub-Windows-Voice-Experimental
          path: |
            build/GamingHub-Windows-Voice.exe
            build/GamingHub-Windows-Voice.pck
          if-no-files-found: error
          retention-days: 14
