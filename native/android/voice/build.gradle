// AndroidX is required by androidx.core in this standalone plugin.
plugins {
    id 'com.android.library' version '8.7.3'
}

android {
    namespace 'com.iroaa15.gaminghub.voice'
    compileSdk 35

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Use the official Godot 4.5.1 Android API published on Maven Central.
    compileOnly 'org.godotengine:godot:4.5.1.stable'
    implementation 'androidx.core:core:1.13.1'
    // WebRTC audio media foundation: Opus, jitter buffer, echo cancellation.
    // Keep the existing PCM path until end-to-end SDP/ICE is validated.
    implementation 'org.webrtc:google-webrtc:1.0.32006'
}
